<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Informático Gestor de Causas del Órgano Judicial (SIGC OJ)</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #525659;
    }

    /* ── Desktop: embed PDF ── */
    #pdf-embed {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Móvil: pantalla de carga/fallback ── */
    #mobile-fallback {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #525659;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 32px 24px;
    }

    #mobile-fallback .pdf-icon {
      font-size: 72px;
      line-height: 1;
    }

    #mobile-fallback h2 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    #mobile-fallback p {
      font-size: 14px;
      color: #bbb;
      max-width: 280px;
      line-height: 1.6;
    }

    #open-pdf-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 4px 20px rgba(37,99,235,0.45);
      letter-spacing: 0.3px;
      margin-top: 4px;
    }

    /* ── Badge flotante (siempre visible) ── */
    #validez-container {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    #validez-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #e1f8e6;
      color: #21ba45;
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(34,168,85,0.35);
      user-select: none;
      white-space: nowrap;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    #validez-badge svg.check-circle {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    /* ── Popup de firma ── */
    #validez-popup {
      position: absolute;
      right: 0;
      top: calc(100% + 12px);
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      padding: 16px 18px;
      min-width: 270px;
      max-width: 310px;
      display: none;
      pointer-events: none;
    }

    #validez-popup.visible {
      display: block;
      pointer-events: auto;
    }

    #validez-popup::before {
      content: '';
      position: absolute;
      right: 26px;
      top: -10px;
      border-width: 0 8px 10px 8px;
      border-style: solid;
      border-color: transparent transparent #fff transparent;
    }

    .popup-title {
      font-size: 13px;
      font-weight: 700;
      color: #222;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .popup-title svg { width: 16px; height: 16px; color: #555; }

    .popup-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .popup-name  { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 2px; }
    .popup-email { font-size: 12px; color: #2563eb; word-break: break-all; }

    .popup-datetime {
      font-size: 11px;
      color: #777;
      text-align: right;
      line-height: 1.4;
    }

    .popup-checks {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }

    .popup-check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #333;
    }

    .popup-check-item svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- Visor PDF (desktop) -->
  <embed id="pdf-embed" src="01.pdf" type="application/pdf">

  <!-- Fallback móvil -->
  <div id="mobile-fallback">
    <div class="pdf-icon">📄</div>
    <h2>Abriendo documento…</h2>
    <p>Si no se abre automáticamente, toca el botón:</p>
    <a id="open-pdf-btn" href="01.pdf">Abrir PDF</a>
  </div>

  <!-- ── Badge flotante (siempre visible) ── -->
  <div id="validez-container">

    <div id="validez-popup">
      <div class="popup-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Firma Digital
      </div>
      <div class="popup-header-row">
        <div>
          <div class="popup-name">ROMER SAUCEDO GOMEZ</div>
          <div class="popup-email">romersaucedotsj2025@gmail.com</div>
        </div>
        <div class="popup-datetime">12/03/2026<br>14:36:40</div>
      </div>
      <div class="popup-checks">
        <div class="popup-check-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22a855" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/>
          </svg>
          Auténtico
        </div>
        <div class="popup-check-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22a855" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/>
          </svg>
          En el periodo de vigencia
        </div>
        <div class="popup-check-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22a855" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/>
          </svg>
          Con certificado no revocado
        </div>
      </div>
    </div>

    <button id="validez-badge" aria-label="Ver validez digital">
      <svg class="check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/>
      </svg>
      VALIDEZ DIGITAL
    </button>

  </div>

  <script>
    // ── Detección móvil ──
    var mobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile/i.test(navigator.userAgent);

    if (mobile) {
      document.getElementById('pdf-embed').style.display = 'none';
      document.getElementById('mobile-fallback').style.display = 'flex';
      // Redirigir automáticamente al PDF (el navegador móvil lo abre directo)
      window.location.href = '01.pdf';
    }

    // ── Lógica del badge ──
    var badge     = document.getElementById('validez-badge');
    var popup     = document.getElementById('validez-popup');
    var container = document.getElementById('validez-container');
    var isTouch   = false;

    function showPopup() { popup.classList.add('visible'); }
    function hidePopup() { popup.classList.remove('visible'); }

    // Desktop: hover
    container.addEventListener('mouseenter', showPopup);
    container.addEventListener('mouseleave', hidePopup);

    // Móvil: tap toggle
    badge.addEventListener('touchstart', function(e) {
      isTouch = true;
      e.preventDefault();
      popup.classList.toggle('visible');
    }, { passive: false });

    // Cerrar al tocar fuera (móvil)
    document.addEventListener('touchstart', function(e) {
      if (isTouch && !container.contains(e.target)) {
        hidePopup();
      }
    });

    // Teclado
    badge.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        popup.classList.toggle('visible');
      }
    });
  </script>
</body>
</html>
