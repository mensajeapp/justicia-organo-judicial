<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Informático Gestor de Causas del Órgano Judicial (SIGC OJ)</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating badge */
    #validez-container {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    #validez-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #e1f8e6;
      color: #21ba45;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(34,168,85,0.35);
      user-select: none;
      white-space: nowrap;
    }

    #validez-badge svg.check-circle {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    #validez-popup {
      position: absolute;
      right: 0;
      top: calc(100% + 12px);
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      padding: 18px 20px;
      min-width: 290px;
      max-width: 330px;
      display: none;
      pointer-events: none;
    }

    #validez-popup.visible {
      display: block;
    }

    #validez-popup::before {
      content: '';
      position: absolute;
      right: 28px;
      top: -10px;
      border-width: 0 8px 10px 8px;
      border-style: solid;
      border-color: transparent transparent #fff transparent;
    }

    .popup-title {
      font-size: 14px;
      font-weight: 700;
      color: #222;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .popup-title svg {
      width: 18px;
      height: 18px;
      color: #555;
    }

    .popup-name {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 2px;
    }

    .popup-email {
      font-size: 13px;
      color: #2563eb;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .popup-date {
      font-size: 13px;
      color: #555;
      margin-bottom: 10px;
    }

    .popup-checks {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-top: 6px;
    }

    .popup-check-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: #333;
    }

    .popup-check-item svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .popup-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .popup-datetime {
      font-size: 12px;
      color: #777;
      text-align: right;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <iframe src="01.pdf"></iframe>

  <div id="validez-container">
    <!-- Popup card -->
    <div id="validez-popup">
      <div class="popup-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Firma Digital
      </div>
      <div class="popup-header-row">
        <div>
          <div class="popup-name">ROMER SAUCEDO GOMEZ</div>
          <div class="popup-email">romersaucedotsj2025@gmail.com</div>
        </div>
        <div class="popup-datetime">
          12/03/2026<br>17:36:40
        </div>
      </div>
      <div class="popup-checks">
        <div class="popup-check-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22a855" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="8 12 11 15 16 9"/>
          </svg>
          Auténtico
        </div>
        <div class="popup-check-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22a855" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="8 12 11 15 16 9"/>
          </svg>
          En el periodo de vigencia
        </div>
        <div class="popup-check-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22a855" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="8 12 11 15 16 9"/>
          </svg>
          Con certificado no revocado
        </div>
      </div>
    </div>

    <!-- Floating badge -->
    <div id="validez-badge" role="button" aria-label="Ver validez digital" tabindex="0">
      <!-- Checkmark circle icon -->
      <svg class="check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="8 12 11 15 16 9"/>
      </svg>
      VALIDEZ DIGITAL
    </div>
  </div>

  <script>
    const badge = document.getElementById('validez-badge');
    const popup = document.getElementById('validez-popup');
    const container = document.getElementById('validez-container');
    let isTouch = false;

    function showPopup() { popup.classList.add('visible'); }
    function hidePopup() { popup.classList.remove('visible'); }

    // Desktop: hover
    container.addEventListener('mouseenter', showPopup);
    container.addEventListener('mouseleave', hidePopup);

    // Mobile: tap toggle
    badge.addEventListener('touchstart', function(e) {
      isTouch = true;
      e.preventDefault();
      if (popup.classList.contains('visible')) {
        hidePopup();
      } else {
        showPopup();
      }
    }, { passive: false });

    // Close on tap outside (mobile)
    document.addEventListener('touchstart', function(e) {
      if (isTouch && !container.contains(e.target)) {
        hidePopup();
      }
    });

    // Keyboard accessibility
    badge.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        popup.classList.toggle('visible');
      }
    });
  </script>
</body>
</html>
